name: opencode smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to test'
        required: true
        default: next
      timeout:
        description: 'seconds to wait before considering opencode stable'
        required: false
        default: '30'
  workflow_call:
    inputs:
      artifact:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timeout:
        type: number
        required: false
        default: 30

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download packed artifact
        if: inputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/package

      - name: Resolve plugin version
        id: version
        env:
          ARTIFACT_NAME: ${{ inputs.artifact }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$ARTIFACT_NAME" ]; then
            TARBALL=$(find "${RUNNER_TEMP}/package" -maxdepth 1 -name '*.tgz' -print -quit)
            if [ -z "$TARBALL" ]; then
              echo "Missing package artifact."
              exit 1
            fi
            VERSION=$(tar -xOf "$TARBALL" package/package.json | jq -r '.version')
            if [ "$VERSION" != "$REQUESTED_VERSION" ]; then
              echo "Expected package version $REQUESTED_VERSION, found $VERSION."
              exit 1
            fi
            echo "spec=opencode-synced@file:$TARBALL" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PACKAGE_SPEC="opencode-synced@${REQUESTED_VERSION:-$REQUESTED_TAG}"
          VERSION=""
          for attempt in 1 2 3 4 5 6; do
            VERSION=$(npm view "$PACKAGE_SPEC" version 2>/dev/null || true)
            if [ -n "$VERSION" ]; then
              break
            fi
            echo "Waiting for npm registry to expose $PACKAGE_SPEC (attempt $attempt/6)"
            sleep 10
          done
          if [ -z "$VERSION" ]; then
            echo "No version found for: $PACKAGE_SPEC"
            exit 1
          fi
          if [ -n "$REQUESTED_VERSION" ] && [ "$VERSION" != "$REQUESTED_VERSION" ]; then
            echo "Expected exact version $REQUESTED_VERSION, resolved $VERSION"
            exit 1
          fi
          echo "spec=opencode-synced@$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install opencode
        env:
          opencode_install_dir: ${{ runner.temp }}/opencode/bin
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "${opencode_install_dir}" >> "$GITHUB_PATH"

      - name: Configure clean opencode home
        env:
          opencode_home: ${{ runner.temp }}/opencode-home
          PLUGIN_SPEC: ${{ steps.version.outputs.spec }}
        run: |
          export HOME="$opencode_home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"

          mkdir -p "$XDG_CONFIG_HOME/opencode"
          cat > "$XDG_CONFIG_HOME/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "plugin": ["${PLUGIN_SPEC}"]
          }
          EOF

          SYNC_REPO="$XDG_DATA_HOME/opencode-synced/repo"
          mkdir -p "$SYNC_REPO"
          git -C "$SYNC_REPO" init -q

          cat > "$XDG_CONFIG_HOME/opencode/opencode-synced.jsonc" <<EOF
          {
            "repo": {
              "owner": "smoke",
              "name": "opencode-config",
            },
            "localRepoPath": "$SYNC_REPO",
            "includeSecrets": false,
            "extraSecretPaths": [],
          }
          EOF

          rm -rf "$XDG_CACHE_HOME/opencode/node_modules"

      - name: Launch opencode (smoke)
        env:
          opencode_home: ${{ runner.temp }}/opencode-home
          opencode_smoke_timeout: ${{ inputs.timeout }}
          opencode_smoke_log: ${{ runner.temp }}/opencode-smoke.log
        run: |
          export HOME="$opencode_home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"

          python - <<'PY'
          import os
          import threading
          import subprocess
          import time
          import sys

          timeout = int(os.environ.get("opencode_smoke_timeout", "20"))
          log_path = os.environ.get("opencode_smoke_log", "opencode-smoke.log")
          cmd = ["opencode", "serve", "--port", "4096", "--hostname", "127.0.0.1"]

          proc = subprocess.Popen(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )

          def reader():
              if not proc.stdout:
                  return
              with open(log_path, "w") as log_file:
                  for line in proc.stdout:
                      log_file.write(line)

          thread = threading.Thread(target=reader, daemon=True)
          thread.start()

          start = time.time()
          while time.time() - start < timeout:
              if proc.poll() is not None:
                  break
              time.sleep(1)

          if proc.poll() is not None:
              print("opencode exited early with code", proc.returncode)
              try:
                  with open(log_path, "r") as log_file:
                      lines = log_file.readlines()
                  tail = "".join(lines[-200:])
                  print("--- opencode output (tail) ---")
                  print(tail)
              except FileNotFoundError:
                  print("No log output captured.")
              sys.exit(1)

          proc.terminate()
          try:
              proc.wait(timeout=5)
          except subprocess.TimeoutExpired:
              proc.kill()
              proc.wait()
          PY

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-smoke-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/opencode-smoke.log
